<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">RECONCILE DB LAB</title><desc id="desc">Quando duas fontes discordam, a trilha explica o porquê.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091522"/><stop offset="1" stop-color="#17283c"/></linearGradient><linearGradient id="accent"><stop stop-color="#f8b86d"/><stop offset="1" stop-color="#f97462"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#60728c" stroke-width=".5" opacity=".25"/></pattern>
